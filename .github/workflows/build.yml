name: 构建
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: 全平台二进制 + Android GUI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Setup Android SDK NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 26b

      - name: 设置Android环境变量
        run: |
          echo "ANDROID_HOME=${{ env.ANDROID_HOME }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ env.ANDROID_HOME }}/ndk/26.2.11394342" >> $GITHUB_ENV

      - name: Install fyne cli
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: 代码检查 vet & build cli
        run: |
          go vet ./cmd/yx
          go build ./cmd/yx

      - name: 编译原有CLI多平台二进制 ./cmd/yx
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=dev
          mkdir -p dist
          build() {
            local os=$1 arch=$2 ext=$3
            echo "→ $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/yx_${os}_${arch}${ext}" ./cmd/yx
          }
          build windows amd64 '.exe'
          ls -lh dist/

      - name: Build Android GUI APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION=dev
          mkdir -p dist
          fyne package \
            --os android \
            --app-id com.qaz.yxgui \
            --app-version ${VERSION} \
            -o dist/yx-gui-${VERSION}.apk \
            ./cmd/gui
          ls -lh dist/

      - name: 打包压缩 & sha256校验
        run: |
          cd dist
          for f in yx_*; do
            case "$f" in
              *.exe) zip -q "${f%.exe}.zip" "$f" ;;
              *.apk) ;;
              *)     tar -czf "$f.tar.gz" "$f" ;;
            esac
          done
          sha256sum * > checksums.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: yx-binaries
          path: dist/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/checksums.txt
          generate_release_notes: true
